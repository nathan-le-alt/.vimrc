### General settings

# Shell for new panes (cmd loads Clink through AutoRun)
set -g default-shell cmd

# Vim style keys in copy mode
setw -g mode-keys vi

# Mouse support
set -g mouse on

# Replaces the tmux-sensible plugin
set -g escape-time 10
set -g history-limit 50000

### Theme support
set -g default-terminal "xterm-256color"

### Keybinding
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Use | and - to split screen
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt + arrows
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch windows using Alt + H/L (Alt+H hides the Clink binding list inside psmux)
bind -n M-h previous-window
bind -n M-l next-window

# Reload this file
bind r source-file ~/.psmux.conf

# Close pane
bind-key x kill-pane

# Not in the psmux docs option table, untested. Remove the # to try it.
# set -g detach-on-destroy off

### Status bar
set -g window-status-separator " "
set -g status-left-style "bg=default"
set -g status-right-style "bg=default"
set -g status-style "bg=default,fg=default"
set-window-option -g window-status-current-style "fg=default,bg=default"
set-window-option -g window-status-style "fg=default,bg=default"

### Plugins (psmux ports, installed with Prefix + I)
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-sensible'
set -g @plugin 'psmux-plugins/psmux-yank'
set -g @plugin 'psmux-plugins/psmux-resurrect'
 
# Initialize ppm (keep this line at the very bottom)
run '~/.psmux/plugins/ppm/ppm.ps2'
